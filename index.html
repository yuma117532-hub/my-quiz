<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
  <title>英語問題アプリ</title>
</head>
<body>


<!--クイズ画面-->
<div id="quizScreen">

<!-- 進捗バーとテキスト -->
<div id="progressContainer">
  <div id="progressBar"></div>
</div>
<p id="progressText"></p>

<h2 id="question"></h2>
<div id="choices"></div>

<p id="result"></p>
<p id="score"></p>

<h2 id="finalResult"></h2>
<button id="restartBtn" onclick="restartQuiz()">もう一度やる</button>
<button id="reviewBtn" onclick="startReview()">復習する</button>
<button id="nextBtn" onclick="nextQuestion()">次の問題へ</button>
<button onclick="goHome()">ホームに戻る</button>
</div>

<!-- ホーム画面 -->
<div id="homeScreen">

  <h1>英語クイズ</h1>
  <label for="categorySelect" >カテゴリーを選択:</label>
  <select id="subjectSelect" onchange="updateCategoryOptions()">
    <option value="すべて">すべて</option>
    <option value="英語">英語</option>
    <option value="数学">数学</option>
  </select>
  <select id="categorySelect">
    <option value="すべて">すべて</option>
    <option value="文法">文法</option>
    <option value="語彙">語彙</option>
  </select>
  <h3>弱点分析</h3>
  <div id="weakness"></div>

  <button onclick="startQuiz()">クイズ開始</button>
</div>
<script src="js/ui.js"></script>
<script src="js/quiz.js"></script>
<script src="js/storage.js"></script>
<script src="js/main.js"></script>
</body>
</html>
